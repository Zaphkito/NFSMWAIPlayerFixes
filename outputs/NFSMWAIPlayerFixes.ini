; NFSMW AI Player Fixes
; Place this file next to NFSMWAIPlayerFixes.asi. Restart the game after making changes.

[Fixes]
AIVehicleCrashFix = 1               // Prevents the null coordinate-owner crash encountered while driving AI vehicles. (0 = False, 1 = True (Default))
AIVehicleResetFix = 1               // Adds the native reset behavior to player-driven AI vehicles when it is missing. Uses the game's assigned reset key. (0 = False, 1 = True (Default))
PlayerCopHealthFix = 1              // Prevents functional damage and wrecking of the local player's police vehicle. Actual AI police damage and normal visual damage processing remain enabled. (0 = False, 1 = True (Default))
PlayerCopVisualDamageFix = 1        // Makes the local player's police vehicle follow the game's Car Damage setting for visual damage. Actual AI police keep their original damage behavior. (0 = False, 1 = True (Default))

AIVehicleAudioFix = 1              // Restores local AI car audio binding and shared helicopter listener telemetry; excludes unbound car effects. Actual AI audio categories remain unchanged. (0 = False, 1 = True (Default))

HelicopterLoadingFix = 1           // Restores native HUD updates and heat forwarding skipped on local player COPHELI. Fixes the loading fade and missing heat display. (0 = False, 1 = True (Default))
HelicopterAccelerationFix = 1      // Excludes local player COPHELI from car performance limiting used by AI racers and pursuing police. Preserves their native driving logic. (0 = False, 1 = True (Default))

[Debug]
EnableLog = 0                      // Writes NFSMWAIPlayerFixes.log next to the ASI for troubleshooting. (0 = False (Default), 1 = True)

